<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .preview-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 50%;
      border: 2px solid #ddd;
      transition: transform 0.3s;
    }
    .preview-img:hover {
      transform: scale(1.2);
      border-color: #28a745;
    }
  </style>
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="text-center mb-4">Edit User</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Age</label>
      <input type="number" name="age" class="form-control" value="{{ user.age }}" min="1" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Photo</label>
      <input type="file" name="photo" class="form-control" accept="image/png, image/jpeg" onchange="previewImage(event)">
      {% if user.photo %}
        <img id="preview" class="preview-img" src="{{ url_for('static', filename='uploads/' + user.photo) }}" alt="{{ user.name }}">
      {% else %}
        <img id="preview" class="preview-img" src="#" style="display:none;" alt="Preview">
      {% endif %}
      <div class="form-text">Leave empty to keep current photo</div>
    </div>

    <button type="submit" class="btn btn-success">Update User</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
function previewImage(event) {
    const preview = document.getElementById('preview');
    if(event.target.files && event.target.files[0]){
        preview.src = URL.createObjectURL(event.target.files[0]);
        preview.style.display = 'block';
    }
}
</script>
</body>
</html>
